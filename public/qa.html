    const QA_DATA = {
      en: [
        { category: 'Why We Built This', items: [
          { q: 'What kinds of things actually happen that make this service necessary?', a: 'A few real examples the platform\'s developers have personally seen — and a large part of why we built this service and priced it so accessibly:<ul>' +
            '<li><strong>A power of attorney gets recorded on a corporate entity.</strong> Shortly after, the person holding it takes out a loan against the property and never pays it back — the owner finds out months later when a foreclosure process (<em>proceso ejecutivo inmobiliario</em>) has already started.</li>' +
            '<li><strong>A property goes unwatched for years, and someone completes adverse possession (squatting).</strong> After enough time, it becomes extremely difficult to remove them. Catching it early, when it starts, usually means you can still stop it. <em>(This isn\'t legal advice — talk to an attorney.)</em></li>' +
            '<li><strong>Inheritance disputes.</strong> An heir takes preemptive action on a property or entity, creating anger, frustration, and confusion among the other heirs. This service tells you as it\'s happening — not months or years later, when it may be too late to do anything about it.</li>' +
            '<li><strong>A lien gets placed on your property for an unpaid bill — real or not — and you\'re never notified,</strong> so you never get the chance to defend yourself against it. After enough time passes, this too becomes very hard or impossible to remove.</li></ul>' }
        ]},
        { category: 'About the Service', items: [
          { q: 'What is Atlas Panama?', a: 'Atlas Panama monitors Panama\'s Registro Público (Public Registry) for changes to properties and legal entities you register with us, and alerts you the moment something changes — so you find out from us, not years later when it\'s too late to act.' },
          { q: 'What can I monitor — just property, or businesses too?', a: 'Both. You can register a property (finca/folio), a Mercantil entity (S.A., Corp, Inc., or S.R.L.), or a Fundación de Interés Privado (private interest foundation).' },
          { q: 'How often do you actually check the Registro Público?', a: 'Every single day, for every property and entity registered on the platform — regardless of how often we email you about it.' },
          { q: 'If you check daily, why don\'t I get an email every day?', a: 'To keep your inbox manageable. Routine "nothing changed" updates are sent weekly by default. If something actually changes, we email you immediately, the same day we find it — real alerts never wait for the weekly schedule.' },
          { q: 'What exactly counts as a "change" you\'d alert me about?', a: 'Anything different across the full record — not just the Prelación (pending registration) tab, but every relevant section, including Miembros Relacionados (board members/officers) and Apoderados (powers of attorney). We check the whole record, not a narrow slice of it.' },
          { q: 'Why does a Power of Attorney (Apoderado) change matter so much?', a: 'A new or modified power of attorney can let someone act legally on behalf of your property or company — including, in the worst case, without your knowledge or authorization. It\'s one of the most consequential changes we watch for.' },
          { q: 'Where do changes to my property or entity actually come from?', a: 'Changes are made through the Prelación process — a document is submitted (a deed of sale, a court order, a change in the board, a declaration of improvements, a power of attorney, and more), and the Registro Público reviews it: they either reject it, request corrections, or approve it. Once approved, it updates your official record — which is exactly the moment we catch it.' },
          { q: 'Will you attach a full PDF report every time?', a: 'If you have 1-2 properties/entities registered, yes, every check. If you have 3 or more, we only attach the full PDF when something actually changed or on your very first check — routine "no change" updates just show a quick status line for each, to keep the email manageable. We explain this directly in the email.' },
          { q: 'Can I register more than one property or entity?', a: 'Not yet through a single signup — that\'s a bulk/multi-property signup feature we\'re building for after launch. Right now it\'s one property or entity per subscription, though if you register several under the same email, you\'ll get one combined email covering all of them, not a separate email for each.' },
          { q: 'Do you guarantee you\'ll catch every single change?', a: 'No — we\'re honest about this upfront. The Registro Público itself can have errors or delays, and our automated checks can occasionally fail or be temporarily blocked. This is a monitoring tool, not a substitute for your own independent verification on anything important.' },
          { q: 'How does Atlas Panama get this information — do you have special access?', a: 'No special access. Everything we check is public information anyone could look up themselves at the Registro Público — we just do it for you, automatically, every day.' }
        ]},
        { category: 'Pricing & Billing', items: [
          { q: 'How much does it cost?', a: 'We\'re starting at $1/month or $10/year as a promotional launch price. We\'ll raise the price to $2/month after a few months. If you\'re already subscribed before that happens, you keep your original price.' },
          { q: 'Do you offer a discount for registering multiple properties?', a: 'Not yet — volume pricing for multi-property subscriptions is planned alongside the bulk signup feature, coming after launch.' },
          { q: 'Does my subscription auto-renew?', a: 'Yes, automatically, unless you cancel first.' },
          { q: 'How do I cancel?', a: 'Through your subscription management link — cancel anytime, and it takes effect at the end of your current billing period.' },
          { q: 'Do you offer refunds?', a: 'No — subscriptions aren\'t refunded for time already billed.' },
          { q: 'Will I be reminded before my subscription renews?', a: 'Yes — you\'ll get a heads-up a few days before renewal either way: a simple "you\'re all set, here\'s how to cancel if you want" if you\'re auto-renewing normally, or "you\'re about to lose coverage" if there\'s a payment issue.' }
        ]},
        { category: 'Privacy & Legal', items: [
          { q: 'Who sees my personal information?', a: 'Only what\'s needed to run the service: Stripe (payment processing) and Postmark (email delivery). We don\'t share your information with the Registro Público — our checks use our own credentials, not yours — and we don\'t sell your data.' },
          { q: 'Is it legal to monitor a property I don\'t own?', a: 'Yes, provided you have a legitimate interest in it — as a prospective buyer, investor, lender, or other professional reason. The Registro Público is public information; that\'s the whole point of a public registry.' },
          { q: 'What should I do if I see a change I don\'t recognize?', a: 'Contact an attorney or accountant right away. Atlas Panama\'s alerts are informational, not legal or financial advice.' },
          { q: 'What happens if there\'s a dispute between me and Atlas Panama?', a: 'It\'s governed by Panamanian law, resolved through binding arbitration in Panama — not US courts.' }
        ]},
        { category: 'Account & Technical', items: [
          { q: 'What languages is this available in?', a: 'Spanish and English.' },
          { q: 'Do you send WhatsApp notifications?', a: 'Not yet — we collect your preference at signup, and it\'s planned as a future addition once the subscriber base grows.' },
          { q: 'What happens if a daily check fails?', a: 'We automatically retry. If it still fails, you\'ll get a brief "we couldn\'t check today" email, and we try again at the next scheduled check.' },
          { q: 'Can I change my registered email or language preference after signing up?', a: 'Right now, email us at <a href="mailto:operations@atlaspanama.com">operations@atlaspanama.com</a> and we\'ll take care of it for you. A self-service way to do this yourself is planned for the near future.' }
        ]},
        { category: 'Registro Público', items: [
          { q: 'In plain, non-legal language, what is "Prelación"?', a: 'It\'s the queue/process a document goes through at the Registro Público before it becomes official — a deed, a court order, a power of attorney, or similar gets submitted, reviewed, and either rejected, sent back for corrections, or approved. Once approved, it updates the permanent record.' },
          { q: 'Are there properties with very little or no real digital record — e.g., older land with no recent transactions?', a: 'Yes — older properties or entities with no recent activity may not show a complete digital record. The first time any change is made, the property goes through a "migración a folio electrónico" (migration to an electronic folio), where whatever historical information the Registro Público has gets uploaded into the new digital record.' },
          { q: 'Can foreigners (non-Panamanian citizens/residents) use this service?', a: 'Yes — there\'s no restriction at all tied to citizenship or residency.' },
          { q: 'How long does a typical Prelación entry take to resolve?', a: 'It varies widely: as fast as 24 hours if an express fee (<em>alteración de turno</em>, around $300) is paid, to weeks or even months for a legal matter. Typical processing is a few days to a week, and timing also depends on how much volume the Registro Público is handling at that moment.' },
          { q: 'Are there properties or ownership situations the Registro Público doesn\'t cover?', a: 'Yes — the Registro Público does not have records for untitled land (<em>derechos posesorios</em>/possessory rights). Atlas Panama can\'t monitor what isn\'t in the registry.' },
          { q: 'If a property has multiple co-owners, can each one subscribe independently?', a: 'Each subscription covers one email address. If multiple owners each want their own monitoring, each needs to subscribe separately — though owners are always free to share the emails they receive amongst themselves.' },
          { q: 'Does this work the same way for property held through a trust (fideicomiso)?', a: 'Yes. A property in a fideicomiso shows up in the Registro Público under the fiduciary\'s (<em>fiduciario</em>\'s) name, but each individual finca still has its own independent record — you can monitor it exactly as if the property were in your own name, regardless of how many other properties that same fiduciary holds in trust.' },
          { q: 'What if you can\'t find my property or entity when I sign up?', a: 'If two search attempts don\'t find a match, you\'ll be prompted to email us at <a href="mailto:operations@atlaspanama.com">operations@atlaspanama.com</a> with as much information as you have — we\'ll help you find it, free of charge.' },
          { q: 'Do embargo/secuestro cases get different guidance than a routine sale?', a: 'No — all changes get the same type of notification and the same standard guidance: if you don\'t recognize or didn\'t authorize it, contact your attorney or accountant.' }
        ]}
      ]
    };
    QA_DATA.es = [

        { q: '¿Qué tipo de situaciones hacen que este servicio sea realmente necesario?', a: 'Aquí tiene algunos ejemplos reales que los desarrolladores de la plataforma han presenciado personalmente — y gran parte de la razón por la que creamos este servicio y lo ofrecemos a un precio tan accesible:<ul>' +
          '<li><strong>Se registra un poder sobre una persona jurídica.</strong> Poco después, la persona que lo posee obtiene un préstamo sobre la propiedad y nunca lo paga — el propietario se entera meses después, cuando ya ha comenzado un proceso ejecutivo inmobiliario.</li>' +
          '<li><strong>Una propiedad queda sin vigilancia durante años, y alguien completa un proceso de posesión adversa (ocupación ilegal).</strong> Después de suficiente tiempo, se vuelve extremadamente difícil desalojarlos. Detectarlo a tiempo, cuando comienza, generalmente significa que todavía puede detenerlo. <em>(Esto no es asesoría legal — consulte a un abogado.)</em></li>' +
          '<li><strong>Disputas de herencia.</strong> Un heredero toma una acción preventiva sobre una propiedad o entidad, generando enojo, frustración y confusión entre los demás herederos. Este servicio le avisa mientras está ocurriendo — no meses o años después, cuando ya puede ser demasiado tarde para hacer algo al respecto.</li>' +
          '<li><strong>Se coloca un gravamen sobre su propiedad por una factura impaga — real o no — y usted nunca es notificado,</strong> por lo que nunca tiene la oportunidad de defenderse. Después de suficiente tiempo, esto también se vuelve muy difícil o imposible de eliminar.</li></ul>' }
      ]},
      { category: 'Sobre el Servicio', items: [
        { q: '¿Qué es Atlas Panama?', a: 'Atlas Panama monitorea el Registro Público de Panamá en busca de cambios en las propiedades y entidades legales que usted registre con nosotros, y le avisa en el momento en que algo cambia — para que se entere por nosotros, no años después, cuando ya sea demasiado tarde para actuar.' },
        { q: '¿Qué puedo monitorear — solo propiedades, o también empresas?', a: 'Ambos. Puede registrar una propiedad (finca/folio), una entidad Mercantil (S.A., Corp, Inc. o S.R.L.), o una Fundación de Interés Privado.' },
        { q: '¿Con qué frecuencia revisan realmente el Registro Público?', a: 'Todos los días, para cada propiedad y entidad registrada en la plataforma — sin importar con qué frecuencia le enviemos correos al respecto.' },
        { q: 'Si revisan a diario, ¿por qué no recibo un correo todos los días?', a: 'Para mantener su bandeja de entrada manejable. Las actualizaciones rutinarias de "sin cambios" se envían semanalmente por defecto. Si algo realmente cambia, le enviamos un correo de inmediato, el mismo día que lo detectamos — las alertas reales nunca esperan el calendario semanal.' },
        { q: '¿Qué se considera exactamente un "cambio" que me notificarían?', a: 'Cualquier diferencia en todo el expediente — no solo en la pestaña de Prelación, sino en cada sección relevante, incluyendo Miembros Relacionados (directivos/dignatarios) y Apoderados. Revisamos el expediente completo, no solo una parte.' },
        { q: '¿Por qué es tan importante un cambio en un Poder (Apoderado)?', a: 'Un poder nuevo o modificado puede permitir que alguien actúe legalmente en nombre de su propiedad o empresa — incluso, en el peor de los casos, sin su conocimiento o autorización. Es uno de los cambios más importantes que vigilamos.' },
        { q: '¿De dónde provienen realmente los cambios en mi propiedad o entidad?', a: 'Los cambios se realizan a través del proceso de Prelación — se presenta un documento (una escritura de venta, una orden judicial, un cambio en la junta directiva, una declaración de mejoras, un poder, y más), y el Registro Público lo revisa: lo rechaza, solicita correcciones, o lo aprueba. Una vez aprobado, actualiza su expediente oficial — que es exactamente el momento en que lo detectamos.' },
        { q: '¿Adjuntarán un informe PDF completo cada vez?', a: 'Si tiene 1 o 2 propiedades/entidades registradas, sí, en cada revisión. Si tiene 3 o más, solo adjuntamos el PDF completo cuando algo realmente cambió o en su primera revisión — las actualizaciones rutinarias de "sin cambios" solo muestran una línea de estado por cada una, para mantener el correo manejable. Lo explicamos directamente en el correo.' },
        { q: '¿Puedo registrar más de una propiedad o entidad?', a: 'Todavía no en un solo registro — esa es una función de registro múltiple que estamos construyendo para después del lanzamiento. Por ahora es una propiedad o entidad por suscripción, aunque si registra varias bajo el mismo correo, recibirá un solo correo combinado que las cubre todas, no un correo separado para cada una.' },
        { q: '¿Garantizan que detectarán absolutamente todos los cambios?', a: 'No — somos honestos sobre esto desde el principio. El propio Registro Público puede tener errores o retrasos, y nuestras revisiones automatizadas pueden fallar ocasionalmente o ser bloqueadas temporalmente. Esta es una herramienta de monitoreo, no un sustituto de su propia verificación independiente en asuntos importantes.' },
        { q: '¿Cómo obtiene Atlas Panama esta información — tienen acceso especial?', a: 'No tenemos acceso especial. Todo lo que revisamos es información pública que cualquiera podría consultar por sí mismo en el Registro Público — simplemente lo hacemos por usted, automáticamente, todos los días.' }
      ]},
      { category: 'Precios y Facturación', items: [
        { q: '¿Cuánto cuesta?', a: 'Estamos comenzando con $1/mes o $10/año como precio promocional de lanzamiento. Subiremos el precio a $2/mes después de algunos meses. Si ya está suscrito antes de que eso ocurra, mantiene su precio original.' },
        { q: '¿Ofrecen descuento por registrar varias propiedades?', a: 'Todavía no — los precios por volumen para suscripciones de múltiples propiedades están planeados junto con la función de registro masivo, disponible después del lanzamiento.' },
        { q: '¿Mi suscripción se renueva automáticamente?', a: 'Sí, automáticamente, a menos que cancele primero.' },
        { q: '¿Cómo cancelo?', a: 'A través de su enlace de gestión de suscripción — cancele en cualquier momento, y tomará efecto al final de su período de facturación actual.' },
        { q: '¿Ofrecen reembolsos?', a: 'No — las suscripciones no se reembolsan por el tiempo ya facturado.' },
        { q: '¿Me avisarán antes de que se renueve mi suscripción?', a: 'Sí — recibirá un aviso unos días antes de la renovación, en cualquier caso: un simple "todo está listo, aquí le mostramos cómo cancelar si lo desea" si su renovación automática está funcionando normalmente, o "está a punto de perder su cobertura" si hay un problema con el pago.' }
      ]},
      { category: 'Privacidad y Aspectos Legales', items: [
        { q: '¿Quién ve mi información personal?', a: 'Solo lo necesario para operar el servicio: Stripe (procesamiento de pagos) y Postmark (envío de correos). No compartimos su información con el Registro Público — nuestras consultas usan nuestras propias credenciales, no las suyas — y no vendemos sus datos.' },
        { q: '¿Es legal monitorear una propiedad que no me pertenece?', a: 'Sí, siempre que tenga un interés legítimo en ella — como comprador potencial, inversionista, prestamista, u otra razón profesional. El Registro Público es información pública; ese es precisamente el propósito de un registro público.' },
        { q: '¿Qué debo hacer si veo un cambio que no reconozco?', a: 'Contacte a un abogado o contador de inmediato. Las alertas de Atlas Panama son informativas, no son asesoría legal ni financiera.' },
        { q: '¿Qué sucede si hay una disputa entre usted y Atlas Panama?', a: 'Se rige por la ley panameña, resuelta mediante arbitraje vinculante en Panamá — no en tribunales de EE.UU.' }
      ]},
      { category: 'Cuenta y Aspectos Técnicos', items: [
        { q: '¿En qué idiomas está disponible?', a: 'Español e inglés.' },
        { q: '¿Envían notificaciones por WhatsApp?', a: 'Todavía no — recopilamos su preferencia al registrarse, y está planeado como una función futura a medida que crezca la base de suscriptores.' },
        { q: '¿Qué sucede si falla una revisión diaria?', a: 'Reintentamos automáticamente. Si aún así falla, recibirá un breve correo de "no pudimos revisar hoy", e intentaremos de nuevo en la próxima revisión programada.' },
        { q: '¿Puedo cambiar mi correo registrado o preferencia de idioma después de suscribirme?', a: 'Por ahora, escríbanos a <a href="mailto:operations@atlaspanama.com">operations@atlaspanama.com</a> y nosotros nos encargamos. Una forma de hacerlo usted mismo está planeada para el futuro cercano.' }
      ]},
      { category: 'Registro Público', items: [
        { q: 'En términos sencillos, ¿qué es la "Prelación"?', a: 'Es la cola/proceso por el que pasa un documento en el Registro Público antes de volverse oficial — se presenta una escritura, una orden judicial, un poder, o similar, se revisa, y se rechaza, se devuelve para correcciones, o se aprueba. Una vez aprobado, actualiza el expediente permanente.' },
        { q: '¿Hay propiedades con muy poco o ningún expediente digital real — por ejemplo, terrenos antiguos sin transacciones recientes?', a: 'Sí — las propiedades o entidades antiguas sin actividad reciente pueden no mostrar un expediente digital completo. La primera vez que se realiza cualquier cambio, la propiedad pasa por una "migración a folio electrónico", donde la información histórica que tenga el Registro Público se carga al nuevo expediente digital.' },
        { q: '¿Pueden los extranjeros (no ciudadanos/residentes panameños) usar este servicio?', a: 'Sí — no hay ninguna restricción vinculada a la ciudadanía o residencia.' },
        { q: '¿Cuánto tiempo tarda normalmente en resolverse una entrada de Prelación?', a: 'Varía mucho: tan rápido como 24 horas si se paga una tarifa exprés (<em>alteración de turno</em>, alrededor de $300), hasta semanas o incluso meses si es un asunto legal. El procesamiento típico es de unos días a una semana, y el tiempo también depende del volumen que esté manejando el Registro Público en ese momento.' },
        { q: '¿Hay propiedades o situaciones de propiedad que el Registro Público no cubre?', a: 'Sí — el Registro Público no tiene registros de terrenos sin título (<em>derechos posesorios</em>). Atlas Panama no puede monitorear lo que no está en el registro.' },
        { q: 'Si una propiedad tiene varios copropietarios, ¿puede cada uno suscribirse independientemente?', a: 'Cada suscripción cubre una dirección de correo. Si varios propietarios desean su propio monitoreo, cada uno debe suscribirse por separado — aunque los propietarios siempre pueden compartir entre ellos los correos que reciben.' },
        { q: '¿Funciona igual para una propiedad en un fideicomiso?', a: 'Sí. Una propiedad en un fideicomiso aparece en el Registro Público a nombre del <em>fiduciario</em>, pero cada finca individual sigue teniendo su propio expediente independiente — puede monitorearla exactamente como si la propiedad estuviera a su propio nombre, sin importar cuántas otras propiedades tenga ese mismo fiduciario en fideicomiso.' },
        { q: '¿Qué pasa si no encuentran mi propiedad o entidad al registrarme?', a: 'Si dos intentos de búsqueda no encuentran una coincidencia, se le pedirá que nos escriba a <a href="mailto:operations@atlaspanama.com">operations@atlaspanama.com</a> con toda la información que tenga — le ayudaremos a encontrarla, sin costo alguno.' },
        { q: '¿Los casos de embargo/secuestro reciben instrucciones diferentes a una venta rutinaria?', a: 'No — todos los cambios reciben el mismo tipo de notificación y la misma indicación estándar: si no reconoce o no autorizó el cambio, contacte a su abogado o contador.' }
      ]}
    ];

    const TRANSLATIONS = {
      es: {
        'nav.subscribe': 'Subscribe', 'nav.about': 'About', 'nav.qa': 'Q&A',
        'qa.title': 'Preguntas Frecuentes',
        'qa.subtitle': 'Busque una palabra o dos, o navegue por categoría.',
        'qa.searchPlaceholder': 'Buscar...',
        'qa.noResults': 'No se encontraron preguntas que coincidan con su búsqueda.'
      },
      en: {
        'nav.subscribe': 'Subscribe', 'nav.about': 'About', 'nav.qa': 'Q&A',
        'qa.title': 'Frequently Asked Questions',
        'qa.subtitle': 'Search a word or two, or browse by category.',
        'qa.searchPlaceholder': 'Search...',
        'qa.noResults': 'No questions matched your search.'
      }
    };

    let currentLang = localStorage.getItem('atlaspanama_lang') || 'es';
    if (currentLang !== 'es' && currentLang !== 'en') currentLang = 'es';

    function t(key) {
      const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.es;
      return dict[key] || TRANSLATIONS.es[key] || key;
    }

    function renderQA(filterText) {
      const list = document.getElementById('qaList');
      const noResults = document.getElementById('qaNoResults');
      const categories = QA_DATA[currentLang] || QA_DATA.es;
      const needle = (filterText || '').trim().toLowerCase();
      list.innerHTML = '';
      let anyVisible = false;

      categories.forEach(cat => {
        const matches = cat.items.filter(item =>
          !needle || item.q.toLowerCase().includes(needle) || item.a.toLowerCase().includes(needle)
        );
        if (matches.length === 0) return;
        anyVisible = true;
        const catEl = document.createElement('div');
        catEl.className = 'qa-category';
        catEl.textContent = cat.category;
        list.appendChild(catEl);
        matches.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'qa-item';
          itemEl.innerHTML = `<div class="qa-q">${item.q}</div><div class="qa-a">${item.a}</div>`;
          list.appendChild(itemEl);
        });
      });

      noResults.style.display = anyVisible ? 'none' : 'block';
    }

    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder'))); });
      renderQA(document.getElementById('qaSearch').value);
    }

    function setLanguage(lang) {
      if (lang !== 'es' && lang !== 'en') return;
      currentLang = lang;
      localStorage.setItem('atlaspanama_lang', lang);
      document.getElementById('langEs').classList.toggle('active', lang === 'es');
      document.getElementById('langEn').classList.toggle('active', lang === 'en');
      applyTranslations();
    }

    document.getElementById('langEs').addEventListener('click', () => setLanguage('es'));
    document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));

    // Search: instant client-side filter, plus a debounced, fire-and-forget log of
    // the query for later analysis (what people search for, gaps in the Q&A).
    let searchLogTimer = null;
    const searchInput = document.getElementById('qaSearch');
    searchInput.addEventListener('input', () => {
      renderQA(searchInput.value);
      clearTimeout(searchLogTimer);
      const query = searchInput.value.trim();
      if (query.length < 2) return;
      searchLogTimer = setTimeout(() => {
        fetch('/qa/search-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, language: currentLang })
        }).catch(() => {}); // best-effort — never blocks or errors the UI
      }, 800);
    });

    setLanguage(currentLang);
  </script>
</body>
</html>
